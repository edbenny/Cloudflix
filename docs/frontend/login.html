<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CloudFlix – Sign In</title><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"><link href="login.css" rel="stylesheet"></head>
<body><nav><a class="logo" href="index.html">CloudFlix</a></nav><main class="page"><section class="card"><div class="card-title">Sign <span>In</span></div><div class="card-sub">Welcome back — pick up where you left off</div><div class="account-types"><div class="account-type selected" onclick="selectType(this)"><div class="account-type-icon">🎬</div><div class="account-type-label">Regular User</div></div><div class="account-type" onclick="selectType(this)"><div class="account-type-icon">🛡</div><div class="account-type-label">Admin</div></div></div><form id="loginForm"><div id="errorMsg" class="error-msg"></div><div class="form-group"><label for="username">Username</label><input class="form-control" id="username" name="username" autocomplete="username" required></div><div class="form-group"><label for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div><button class="submit-btn" type="submit">Sign In</button></form><div class="divider"><div class="divider-line"></div><div class="divider-text">New here?</div><div class="divider-line"></div></div><div class="register-link">Don't have an account? <a href="register.html">Create one free</a></div></section></main>
<script>
function selectType(el){document.querySelectorAll('.account-type').forEach(e=>e.classList.remove('selected'));el.classList.add('selected')}
function isSafeInput(value){const sqlPatterns=/('|--|;|\/\*|\*\/|xp_|UNION|SELECT|INSERT|UPDATE|DELETE|DROP|CREATE|ALTER|EXEC|EXECUTE|CAST|CONVERT|CHAR|NCHAR|VARCHAR|NVARCHAR|BEGIN|END)/i;return !sqlPatterns.test(value)}
document.getElementById('loginForm').addEventListener('submit',async function(e){e.preventDefault();const username=document.getElementById('username').value.trim();const password=document.getElementById('password').value;const errorMsg=document.getElementById('errorMsg');errorMsg.classList.remove('visible');if(!isSafeInput(username)||!isSafeInput(password)){errorMsg.textContent='Invalid characters detected in input.';errorMsg.classList.add('visible');return}if(!/^[a-zA-Z0-9_\-]+$/.test(username)){errorMsg.textContent='Username can only contain letters, numbers, _ and -.';errorMsg.classList.add('visible');return}try{const response=await fetch('/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const data=await response.json();if(response.ok){localStorage.setItem('cloudflix_user',data.username);window.location.href='index.html'}else{errorMsg.textContent=data.error||'Login failed';errorMsg.classList.add('visible')}}catch(err){console.error('Login error:',err);errorMsg.textContent='Cannot connect to server. Make sure Flask is running.';errorMsg.classList.add('visible')}})
</script></body></html>
